name: Repository update qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_TOOL_SHA: 2bcd0597f660e4b6f4d1bc802e38aada5f96111b
  SCAD_TOOL_SHA: 229aea1475d3fda2dc9252e6e442708df44b8812

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
      - name: Bootstrap exact pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          ./bootstrap.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "$GIT_TOOL_SHA"
          test "$(git -C tools/tool.scad-project rev-parse HEAD)" = "$SCAD_TOOL_SHA"
      - name: Verify generic launcher provenance
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Managed-Source: brainboxemb/tool.git-project/bootstrap/consumer-update.sh" update.sh
          grep -F "Managed-Source-Version: 0.2.9" update.sh
          grep -F "Managed-Source-Revision: $GIT_TOOL_SHA" update.sh
          ! grep -Ei 'python|scad-project' update.sh
      - name: Status is read-only
        shell: bash
        run: |
          set -euo pipefail
          before="$(git status --porcelain)"
          ./update.sh status
          after="$(git status --porcelain)"
          test "$before" = "$after"
      - name: Generic update invokes SCAD post-update hook
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s#project-build.yml@$SCAD_TOOL_SHA#project-build.yml@v0.15.7#" .github/workflows/scad.yml
          grep -F "project-build.yml@v0.15.7" .github/workflows/scad.yml
          ./update.sh
          grep -F "project-build.yml@$SCAD_TOOL_SHA" .github/workflows/scad.yml
          test -z "$(git status --porcelain)"

  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
      - name: Bootstrap exact pinned tooling
        shell: pwsh
        run: |
          .\bootstrap.ps1
          $gitActual = (git -C tools/tool.git-project rev-parse HEAD).Trim()
          $scadActual = (git -C tools/tool.scad-project rev-parse HEAD).Trim()
          if ($gitActual -ne $env:GIT_TOOL_SHA) { throw "Unexpected tool.git-project SHA: $gitActual" }
          if ($scadActual -ne $env:SCAD_TOOL_SHA) { throw "Unexpected tool.scad-project SHA: $scadActual" }
      - name: Verify generic launcher provenance
        shell: pwsh
        run: |
          $text = [System.IO.File]::ReadAllText((Join-Path $PWD "update.ps1"))
          if ($text -notmatch 'Managed-Source: brainboxemb/tool.git-project/bootstrap/consumer-update.ps1') { throw "Missing managed source." }
          if ($text -notmatch 'Managed-Source-Version: 0.2.9') { throw "Missing managed source version." }
          if ($text -notmatch "Managed-Source-Revision: $env:GIT_TOOL_SHA") { throw "Missing managed source revision." }
          if ($text -match '(?i)python|scad-project') { throw "Root updater contains domain/Python coupling." }
      - name: Status is read-only
        shell: pwsh
        run: |
          $before = (git status --porcelain) -join "`n"
          .\update.ps1 status
          $after = (git status --porcelain) -join "`n"
          if ($before -ne $after) { throw "status changed the worktree." }
      - name: Generic update invokes SCAD post-update hook
        shell: pwsh
        run: |
          $path = Join-Path $PWD ".github/workflows/scad.yml"
          $text = [System.IO.File]::ReadAllText($path)
          $text = $text.Replace("project-build.yml@$env:SCAD_TOOL_SHA", "project-build.yml@v0.15.7")
          [System.IO.File]::WriteAllText($path, $text, (New-Object System.Text.UTF8Encoding($false)))
          if ([System.IO.File]::ReadAllText($path) -notmatch 'project-build.yml@v0\.15\.7') { throw "Failed to make workflow ref stale." }
          .\update.ps1
          if ([System.IO.File]::ReadAllText($path) -notmatch "project-build\.yml@$env:SCAD_TOOL_SHA") { throw "SCAD hook did not restore workflow ref." }
          $dirty = (git status --porcelain) -join "`n"
          if ($dirty) { throw "Qualification left worktree dirty: $dirty" }
