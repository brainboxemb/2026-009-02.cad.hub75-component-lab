name: Test repository update

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout consumer without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Reproduce stale bootstrap worktree and update
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git ls-files --stage -- tools/tool.git-project | awk '{print $2}')"
          test -n "$expected"

          git submodule sync -- tools/tool.git-project
          git submodule update --init -- tools/tool.git-project
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "$expected"

          git -C tools/tool.git-project fetch origin --tags
          stale="$(git -C tools/tool.git-project rev-parse "$expected^")"
          git -C tools/tool.git-project checkout --detach "$stale" >/dev/null

          if ./update.sh status > stale-status.log 2>&1; then
            cat stale-status.log
            echo "status unexpectedly accepted stale bootstrap engine" >&2
            exit 1
          fi
          cat stale-status.log
          grep -Eq '^tool\.git-project[[:space:]]+BOOTSTRAP state=DIFF' stale-status.log
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "$stale"

          ./update.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "$expected"

          ./update.sh status > current-status.log 2>&1
          cat current-status.log
          grep -Eq '^tool\.git-project[[:space:]]+BOOTSTRAP state=OK' current-status.log
          grep -q 'version=v0.2.12' current-status.log

  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout consumer without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Reproduce stale bootstrap worktree and update
        shell: pwsh
        run: |
          $entry = (git ls-files --stage -- tools/tool.git-project | Select-Object -First 1)
          if ($entry -notmatch '^160000\s+([0-9a-fA-F]{40})\s') { throw "Bootstrap gitlink missing." }
          $expected = $Matches[1].ToLowerInvariant()

          git submodule sync -- tools/tool.git-project
          git submodule update --init -- tools/tool.git-project
          $current = (git -C tools/tool.git-project rev-parse HEAD).Trim().ToLowerInvariant()
          if ($current -ne $expected) { throw "Initial bootstrap checkout does not match gitlink." }

          git -C tools/tool.git-project fetch origin --tags
          $stale = (git -C tools/tool.git-project rev-parse "$expected^").Trim().ToLowerInvariant()
          git -C tools/tool.git-project checkout --detach $stale | Out-Null

          $statusFailed = $false
          try {
            .\update.ps1 status
          } catch {
            $statusFailed = $true
            if ($_.Exception.Message -notmatch 'committed gitlink') { throw }
            Write-Host $_.Exception.Message
          }
          if (-not $statusFailed) { throw "status unexpectedly accepted stale bootstrap engine" }
          $afterStatus = (git -C tools/tool.git-project rev-parse HEAD).Trim().ToLowerInvariant()
          if ($afterStatus -ne $stale) { throw "Read-only status moved bootstrap worktree." }

          .\update.ps1
          $aligned = (git -C tools/tool.git-project rev-parse HEAD).Trim().ToLowerInvariant()
          if ($aligned -ne $expected) { throw "Update did not restore bootstrap gitlink." }

          $status = (& .\update.ps1 status 6>&1 3>&1 2>&1 | Out-String)
          Write-Host $status
          if ($status -notmatch 'tool\.git-project\s+BOOTSTRAP state=OK') { throw "Bootstrap OK status missing." }
          if ($status -notmatch 'version=v0\.2\.12') { throw "Released bootstrap version missing." }
